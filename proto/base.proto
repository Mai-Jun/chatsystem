syntax = "proto3";
package im;
option cc_generic_services = true;

// ============================================================
// base.proto —— 全项目公共枚举与公共结构
// ============================================================

// 消息类型
enum MessageType {
  MESSAGE_TYPE_TEXT  = 0;  // 文本
  MESSAGE_TYPE_IMAGE = 1;  // 图片
  MESSAGE_TYPE_FILE  = 2;  // 文件
  MESSAGE_TYPE_VOICE = 3;  // 语音
}

// 会话类型
enum SessionType {
  SESSION_TYPE_SINGLE = 0; // 单聊（同意好友时自动创建）
  SESSION_TYPE_GROUP  = 1; // 群聊
}

// 好友申请状态
enum ApplyStatus {
  APPLY_STATUS_PENDING = 0; // 待处理
  APPLY_STATUS_AGREE   = 1; // 已同意
  APPLY_STATUS_REJECT  = 2; // 已拒绝
}

// 用户信息
message UserInfo {
  string user_id        = 1; // uuid，全局唯一
  string nickname       = 2;
  string description    = 3; // 个人简介
  string phone          = 4; // 登录账号
  string avatar_file_id = 5; // 头像文件 id（文件子服务管理）
}

// 文件数据（上传时 file_id 留空由服务端生成）
message FileData {
  string file_id      = 1;
  string file_name    = 2;
  int64  file_size    = 3;
  bytes  file_content = 4;
}

// 消息实体（存储与推送共用）
message MessageInfo {
  string message_id      = 1;  // 服务端生成
  string chat_session_id = 2;
  string sender_id       = 3;
  MessageType type       = 4;
  string content         = 5;  // 文本内容
  string file_id         = 6;  // 图片/文件/语音对应文件 id
  string file_name       = 7;
  int64  file_size       = 8;
  string asr_text        = 9;  // 语音转写文本（语音消息专用）
  int64  create_time     = 10; // 秒级时间戳
}

// 会话信息
message ChatSessionInfo {
  string chat_session_id = 1;
  SessionType type       = 2;
  string session_name    = 3; // 单聊会话名为空，客户端用对方昵称展示
  string creator_id      = 4; // 群主 id（单聊为空）
}

// 会话成员条目
message SessionMemberInfo {
  string user_id        = 1;
  string nickname       = 2;
  string avatar_file_id = 3;
}
