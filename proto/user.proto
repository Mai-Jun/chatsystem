syntax = "proto3";
package im;
import "base.proto";
option cc_generic_services = true;

// ============================================================
// user.proto —— 用户子服务：注册/登录(短信验证码)/信息/头像
// 端口约定: 10001
// ============================================================

enum LoginType {
  LOGIN_BY_PASSWORD = 0; // 手机号 + 密码
  LOGIN_BY_SMS      = 1; // 手机号 + 短信验证码
}

// ---- 短信验证码 ----
message SendSmsCodeReq { string phone = 1; }
message SendSmsCodeResp {
  bool   success = 1;
  string errmsg  = 2;
}

// ---- 注册（手机号 + 验证码 + 昵称密码）----
message UserRegisterReq {
  string phone          = 1;
  string sms_code       = 2;
  string nickname       = 3;
  string password       = 4;
  string avatar_file_id = 5; // 可空，注册后可再设置
}
message UserRegisterResp {
  bool   success = 1;
  string errmsg  = 2;
  string user_id = 3;
}

// ---- 登录（双方式）----
message UserLoginReq {
  string    phone      = 1;
  LoginType login_type = 2;
  string    password   = 3; // 密码登录时有效
  string    sms_code   = 4; // 验证码登录时有效
}
message UserLoginResp {
  bool     success   = 1;
  string   errmsg    = 2;
  string   token     = 3; // 会话令牌，后续 HTTP/WS 鉴权携带（Redis TTL）
  UserInfo user_info = 4;
}

// ---- 登出 ----
message UserLogoutReq { string token = 1; }
message UserLogoutResp {
  bool   success = 1;
  string errmsg  = 2;
}

// ---- 获取用户信息 ----
message GetUserInfoReq { string user_id = 1; }
message GetUserInfoResp {
  bool     success   = 1;
  string   errmsg    = 2;
  UserInfo user_info = 3;
}

// ---- 修改用户信息 ----
message SetUserInfoReq {
  string user_id     = 1;
  string nickname    = 2;
  string description = 3;
  string phone       = 4; // 换绑手机（预留）
}
message SetUserInfoResp {
  bool   success = 1;
  string errmsg  = 2;
}

// ---- 修改头像 ----
message SetUserAvatarReq {
  string   user_id = 1;
  FileData avatar  = 2;
}
message SetUserAvatarResp {
  bool   success         = 1;
  string errmsg          = 2;
  string avatar_file_id  = 3;
}

service UserService {
  rpc SendSmsCode(SendSmsCodeReq) returns (SendSmsCodeResp);
  rpc UserRegister(UserRegisterReq) returns (UserRegisterResp);
  rpc UserLogin(UserLoginReq) returns (UserLoginResp);
  rpc UserLogout(UserLogoutReq) returns (UserLogoutResp);
  rpc GetUserInfo(GetUserInfoReq) returns (GetUserInfoResp);
  rpc SetUserInfo(SetUserInfoReq) returns (SetUserInfoResp);
  rpc SetUserAvatar(SetUserAvatarReq) returns (SetUserAvatarResp);
}
